aid: getinsured
name: GetInsured
description: 'GetInsured (Vimo, Inc.) is a SaaS technology provider for public-sector
  healthcare that powers state-based health insurance marketplaces (SBMs). Its platform
  handles eligibility and enrollment, plan shopping and comparison, and consumer-assistance
  contact-center operations for state ACA exchanges. GetInsured powers ten state marketplaces
  (including Idaho, Illinois, Minnesota, Nevada, New Jersey, New Mexico, Pennsylvania,
  Georgia, Virginia, and Oregon, with Oregon launching in 2027) and supported the migration
  of roughly 4.5 million people off Healthcare.gov. It sells to state governments, insurance
  carriers, agents/brokers, and enrollment assisters. GetInsured does not publish a public
  self-serve developer portal or API; integrations are delivered under contract. Backed by
  Bessemer Venture Partners. This profile was enriched by the API Evangelist pipeline.'
